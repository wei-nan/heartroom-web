<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>心有一處 Heartroom</title>
  <meta name="description" content="給父母的私人情緒日誌。願每一種感受，心裡都有一處可以安放。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="心有一處 Heartroom">
  <meta property="og:description" content="給父母的私人情緒日誌。願每一種感受，心裡都有一處可以安放。">
  <link rel="icon" type="image/png" href="appicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="lang-redirect.js"></script>
</head>
<body>
  <header class="nav-header">
    <div class="container nav-container">
      <a href="index.html" class="logo-group">
        <img src="appicon.png" alt="" class="logo-img">
        <span class="logo-text">心有一處</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="active">首頁</a><a href="support.html">聯絡我們</a><a href="privacy-policy.html">隱私權政策</a>
        <a href="en/index.html" class="lang-switch" data-lang="en" lang="en">EN</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card hero">
      <img src="appicon.png" alt="心有一處 App 圖示" class="logo-img">
      <h1>心有一處</h1>
      <p class="tagline">願每一種感受，心裡都有一處可以安放</p>
      <p class="lead">給父母的私人情緒日誌。在情緒湧上來的當下，用幾秒鐘記下自己的感受；等有餘裕時，再回頭看看當時的自己。</p>
    </section>

    <div class="points">
      <div class="point"><h2>只屬於你</h2><p>不需要帳號，資料預設只存在你的 iPhone，開啟需要 Face ID 或密碼。</p></div>
      <div class="point"><h2>不分析、不評價</h2><p>沒有圖表、沒有分數，也不用 AI 解讀你的感受。</p></div>
      <div class="point"><h2>不追蹤</h2><p>App 沒有廣告、分析或追蹤工具，我們看不到你寫的任何內容。</p></div>
    </div>

    <section class="screens">
      <h2>畫面預覽</h2>
      <div class="screens-grid">
        <figure class="screen-figure">
          <img src="screenshots/01_record_entry.webp" alt="記錄畫面：選擇感受、設定主要感受、拉強度、寫下想法" loading="lazy">
          <figcaption>記下此刻——選擇感受、標出最明顯的一種，強度與備註都可以留白。</figcaption>
        </figure>
        <figure class="screen-figure">
          <img src="screenshots/02_record_success.webp" alt="儲存完成畫面" loading="lazy">
          <figcaption>確認寫進手機後才顯示完成，可以直接結束，也可以接著寫回顧。</figcaption>
        </figure>
        <figure class="screen-figure">
          <img src="screenshots/03_history_list.webp" alt="歷史列表畫面" loading="lazy">
          <figcaption>依時間倒序的私人日誌，隨時回頭看看寫過什麼。</figcaption>
        </figure>
        <figure class="screen-figure">
          <img src="screenshots/06_history_calendar.webp" alt="情緒月曆畫面" loading="lazy">
          <figcaption>情緒月曆一覽這個月哪幾天有記錄，不做效價或強度編碼，也不計算完成率。</figcaption>
        </figure>
        <figure class="screen-figure">
          <img src="screenshots/04_history_day_entries.webp" alt="同一天多筆紀錄清單" loading="lazy">
          <figcaption>同一天寫了不只一筆？點進當天也不會漏看任何一筆。</figcaption>
        </figure>
        <figure class="screen-figure">
          <img src="screenshots/05_history_detail.webp" alt="單筆紀錄明細畫面" loading="lazy">
          <figcaption>紀錄明細保留原始內容，事後回顧不會覆寫當時寫下的自己。</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 心有一處 Heartroom</p>
      <a href="index.html">首頁</a><a href="support.html">聯絡我們</a><a href="privacy-policy.html">隱私權政策</a>
    </div>
  </footer>
</body>
</html>
